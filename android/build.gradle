// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // L'app usa lo scanner di Google Play services ("barcode_ui" nel manifest), non quello del plugin:
    // il modello di riconoscimento dentro l'APK (circa 9 MB) non serve. Questa versione della stessa
    // libreria lo lascia a Google Play services, con le stesse classi per il plugin.
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute(module('com.google.mlkit:barcode-scanning'))
                .using(module('com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'))
                .because('APK più leggero: il modello del codice a barre lo fornisce Google Play services')
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
